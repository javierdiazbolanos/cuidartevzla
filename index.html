    <!-- Fuentes: Inter pesos esenciales. media="print" → no bloquea render; onload activa -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-sky-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Forzar registro del Service Worker autodestructivo para borrar cachés del tirón
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(function(reg) {
            reg.update(); // Forzar actualización si ya existía
          })
          .catch(function(err) {
            console.log('SW registration:', err);
          });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
  </body>
